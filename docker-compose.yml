services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Segredos vêm do .env da raiz (não versionado) — ver .env.example
      POSTGRES_USER: "${POSTGRES_USER:-financeai}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}"
      POSTGRES_DB: "${POSTGRES_DB:-financeai}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeai"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-financeai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-financeai}?sslmode=disable"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
      SEED_USER_PASSWORD: "${SEED_USER_PASSWORD:-}"
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:5173,http://localhost:4173,http://localhost:5174}"
      # Storage local: arquivos salvos em ./uploads dentro do container,
      # montados no host em ./backend/uploads
      LOCAL_UPLOAD_DIR: /app/uploads
      LOCAL_UPLOAD_URL: "http://localhost:8080/uploads"
      EXCHANGE_RATE_API_URL: "${EXCHANGE_RATE_API_URL:-https://api.exchangerate-api.com/v4/latest}"
      # AWS vars omitidas → usa storage local automaticamente
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: "http://localhost:8080"
    restart: unless-stopped

  dispensa:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - ./dispensaAI:/app
      - dispensa_node_modules:/app/node_modules
    environment:
      VITE_API_URL: "http://localhost:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
  dispensa_node_modules:
